<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" role="img" aria-label="ClaudeStats shown in the VS Code status bar, with its usage hover panel open">
  <title>ClaudeStats in the VS Code status bar</title>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0b0e13"/>
    </linearGradient>

    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="panelShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="windowClip">
      <rect x="32" y="32" width="1216" height="736" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1280" height="800" fill="url(#canvas)"/>

  <!-- ─────────────  window shell  ───────────── -->
  <g filter="url(#windowShadow)">
    <rect x="32" y="32" width="1216" height="736" rx="12" fill="#1f1f1f"/>
  </g>

  <g clip-path="url(#windowClip)">

    <!-- title bar -->
    <rect x="32" y="32" width="1216" height="36" fill="#181818"/>

    <!-- VS Code mark -->
    <g transform="translate(48 40) scale(0.2)">
      <path fill="#0098ff" d="M70.9 99.3a5.9 5.9 0 0 0 4.7-.2l19.9-9.6a5.9 5.9 0 0 0 3.3-5.3V15.8a5.9 5.9 0 0 0-3.3-5.3L75.6.9a5.9 5.9 0 0 0-6.7 1.1L30.8 36.8 14.2 24.2a3.9 3.9 0 0 0-5 .2l-5.3 4.8a3.9 3.9 0 0 0 0 5.8L18.3 50 3.9 64.9a3.9 3.9 0 0 0 0 5.8l5.3 4.8a3.9 3.9 0 0 0 5 .2l16.6-12.6 38.1 34.8a5.9 5.9 0 0 0 2 1.4ZM75.2 27.3 46.3 50l28.9 22.7V27.3Z"/>
    </g>

    <!-- menu placeholders -->
    <g fill="#343434">
      <rect x="82" y="47" width="22" height="6" rx="3"/>
      <rect x="114" y="47" width="26" height="6" rx="3"/>
      <rect x="150" y="47" width="30" height="6" rx="3"/>
      <rect x="190" y="47" width="20" height="6" rx="3"/>
      <rect x="220" y="47" width="24" height="6" rx="3"/>
      <rect x="254" y="47" width="28" height="6" rx="3"/>
    </g>

    <!-- command bar placeholder -->
    <rect x="470" y="40" width="340" height="20" rx="6" fill="#2a2a2a"/>

    <!-- window chrome -->
