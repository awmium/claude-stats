    <line x1="324" y1="68" x2="324" y2="740" stroke="#2b2b2b" stroke-width="1"/>
    <rect x="98" y="86" width="74" height="7" rx="3.5" fill="#3d3d3d"/>

    <g fill="#2e2e2e">
