    <rect x="324" y="68" width="168" height="36" fill="#1f1f1f"/>
    <rect x="324" y="68" width="168" height="2" fill="#0098ff"/>
    <rect x="344" y="82" width="104" height="7" rx="3.5" fill="#4a4a4a"/>
    <rect x="512" y="82" width="90" height="7" rx="3.5" fill="#303030"/>
    <rect x="628" y="82" width="112" height="7" rx="3.5" fill="#303030"/>
    <rect x="766" y="82" width="84" height="7" rx="3.5" fill="#303030"/>

    <!-- ─────────────  editor pane  ───────────── -->
    <rect x="324" y="104" width="466" height="636" fill="#1f1f1f"/>
    <g fill="#2b2b2b">
      <rect x="352" y="130" width="14" height="6" rx="3"/>
      <rect x="352" y="154" width="14" height="6" rx="3"/>
      <rect x="352" y="178" width="14" height="6" rx="3"/>
      <rect x="352" y="202" width="14" height="6" rx="3"/>
      <rect x="352" y="226" width="14" height="6" rx="3"/>
      <rect x="352" y="250" width="14" height="6" rx="3"/>
      <rect x="352" y="274" width="14" height="6" rx="3"/>
      <rect x="352" y="298" width="14" height="6" rx="3"/>
