    <!-- ─────────────  status bar  ───────────── -->
    <rect x="32" y="740" width="1216" height="28" fill="#181818"/>
    <line x1="32" y1="740" x2="1248" y2="740" stroke="#2b2b2b" stroke-width="1"/>
    <g fill="#333333">
      <rect x="50" y="750" width="52" height="8" rx="4"/>
      <rect x="114" y="750" width="30" height="8" rx="4"/>
      <rect x="156" y="750" width="44" height="8" rx="4"/>
      <rect x="212" y="750" width="36" height="8" rx="4"/>
      <rect x="880" y="750" width="34" height="8" rx="4"/>
      <rect x="926" y="750" width="28" height="8" rx="4"/>
    </g>

    <!-- the extension's own status bar item -->
    <rect x="1086" y="744" width="146" height="20" rx="5" fill="#0098ff" fill-opacity="0.14"/>
    <polyline points="1100,754 1104,754 1107,748 1111,760 1114,754 1118,754"
              fill="none" stroke="#4daafc" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1126" y="758" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif"
          font-size="12.5" fill="#e6e6e6">10%  ·  2%</text>

  </g>

  <!-- ─────────────  usage hover panel  ───────────── -->
  <g filter="url(#panelShadow)">
    <rect x="932" y="520" width="300" height="204" rx="8" fill="#202020" stroke="#454545" stroke-width="1"/>
  </g>

  <g font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif">

    <text x="952" y="546" font-size="13" font-weight="600" fill="#e6e6e6">Claude Code usage</text>
    <line x1="952" y1="558" x2="1212" y2="558" stroke="#3a3a3a" stroke-width="1"/>

    <!-- table head -->
    <text x="952"  y="576" font-size="10.5" fill="#8a8a8a">Window</text>
    <text x="1136" y="576" font-size="10.5" fill="#8a8a8a" text-anchor="end">Used</text>
    <text x="1212" y="576" font-size="10.5" fill="#8a8a8a" text-anchor="end">Resets</text>

    <!-- rows -->
    <text x="952"  y="598" font-size="12" fill="#cccccc">Session (5hr)</text>
    <text x="1136" y="598" font-size="12" fill="#e6e6e6" text-anchor="end">10%</text>
    <text x="1212" y="598" font-size="12" fill="#9d9d9d" text-anchor="end">in 3h</text>

    <text x="952"  y="620" font-size="12" fill="#cccccc">Weekly (7 day)</text>
    <text x="1136" y="620" font-size="12" fill="#e6e6e6" text-anchor="end">2%</text>
    <text x="1212" y="620" font-size="12" fill="#9d9d9d" text-anchor="end">in 6d</text>

    <text x="952"  y="642" font-size="12" fill="#cccccc">Weekly Fable</text>
    <text x="1136" y="642" font-size="12" fill="#e6e6e6" text-anchor="end">0%</text>
    <text x="1212" y="642" font-size="12" fill="#9d9d9d" text-anchor="end">in 6d</text>

    <line x1="952" y1="660" x2="1212" y2="660" stroke="#3a3a3a" stroke-width="1"/>

    <text x="952" y="678" font-size="10.5" font-style="italic" fill="#8a8a8a">just now · from session</text>
    <text x="952" y="696" font-size="10.5" font-style="italic" fill="#8a8a8a">Account: dev@example.com</text>
    <text x="952" y="714" font-size="11.5" fill="#4daafc">Refresh now</text>

  </g>
