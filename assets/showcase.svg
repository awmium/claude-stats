      <rect x="1189" y="46" width="11" height="8" rx="2"/>
      <rect x="1212" y="46" width="11" height="8" rx="2"/>
    </g>

    <!-- ─────────────  activity bar  ───────────── -->
    <rect x="32" y="68" width="48" height="672" fill="#181818"/>
    <rect x="32" y="84" width="2" height="22" fill="#0098ff"/>
    <g fill="#3a3a3a">
      <rect x="46" y="86" width="20" height="18" rx="4"/>
      <rect x="46" y="126" width="20" height="18" rx="4"/>
      <rect x="46" y="166" width="20" height="18" rx="4"/>
      <rect x="46" y="206" width="20" height="18" rx="4"/>
      <rect x="46" y="246" width="20" height="18" rx="4"/>
