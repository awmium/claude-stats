      <rect x="122" y="270" width="110" height="7" rx="3.5"/>
      <rect x="122" y="294" width="78" height="7" rx="3.5"/>
      <rect x="110" y="318" width="120" height="7" rx="3.5"/>
      <rect x="98" y="350" width="100" height="7" rx="3.5"/>
      <rect x="110" y="374" width="132" height="7" rx="3.5"/>
      <rect x="122" y="398" width="86" height="7" rx="3.5"/>
      <rect x="122" y="422" width="108" height="7" rx="3.5"/>
      <rect x="110" y="446" width="94" height="7" rx="3.5"/>
      <rect x="98" y="478" width="124" height="7" rx="3.5"/>
      <rect x="110" y="502" width="82" height="7" rx="3.5"/>
      <rect x="110" y="526" width="114" height="7" rx="3.5"/>
    </g>

    <!-- ─────────────  tab strip  ───────────── -->
