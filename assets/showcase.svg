      <rect x="400" y="177" width="214" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="400" y="201" width="152" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="416" y="225" width="188" height="8" rx="4" fill="#3a4a5a"/>
      <rect x="416" y="249" width="124" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="400" y="273" width="206" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="384" y="297" width="88" height="8" rx="4" fill="#33403d"/>
      <rect x="400" y="321" width="176" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="416" y="345" width="142" height="8" rx="4" fill="#3a4a5a"/>
      <rect x="416" y="369" width="196" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="400" y="393" width="110" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="384" y="417" width="164" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="400" y="441" width="132" height="8" rx="4" fill="#33403d"/>
      <rect x="400" y="465" width="202" height="8" rx="4" fill="#2f2f2f"/>
      <rect x="384" y="489" width="94" height="8" rx="4" fill="#2f2f2f"/>
    </g>

    <!-- ─────────────  preview pane  ───────────── -->
    <line x1="790" y1="104" x2="790" y2="740" stroke="#2b2b2b" stroke-width="1"/>
    <rect x="790" y="104" width="458" height="636" fill="#1f1f1f"/>
    <rect x="822" y="134" width="196" height="16" rx="5" fill="#3f3f3f"/>
    <rect x="822" y="166" width="64" height="9" rx="4.5" fill="#2c3a4a"/>
    <rect x="894" y="166" width="58" height="9" rx="4.5" fill="#2c3a4a"/>
    <g fill="#2b2b2b">
      <rect x="822" y="198" width="330" height="7" rx="3.5"/>
      <rect x="822" y="218" width="286" height="7" rx="3.5"/>
    </g>
    <rect x="822" y="246" width="388" height="58" rx="6" fill="#242424"/>
    <g fill="#2b2b2b">
      <rect x="822" y="324" width="120" height="9" rx="4.5"/>
      <rect x="822" y="350" width="388" height="1"/>
      <rect x="822" y="366" width="340" height="7" rx="3.5"/>
      <rect x="822" y="386" width="302" height="7" rx="3.5"/>
      <rect x="822" y="406" width="356" height="7" rx="3.5"/>
